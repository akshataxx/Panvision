name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys against the VM at once; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/panvision/app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - run: python -m unittest discover -s app/tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # keyless auth to Google Cloud via Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose files to the VM
        run: |
          gcloud compute scp docker-compose.yml deploy/Caddyfile "${{ vars.GCP_VM_NAME }}:~/" \
            --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet

      - name: Roll out the new image
        run: |
          gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            --command "$(cat <<EOF
          set -euo pipefail
          sudo install -d /opt/panvision
          sudo cp ~/docker-compose.yml ~/Caddyfile /opt/panvision/
          printf 'PANVISION_IMAGE=%s\nPANVISION_DOMAIN=%s\n' '${{ env.IMAGE }}:${{ github.sha }}' '${{ vars.PANVISION_DOMAIN }}' \
            | sudo tee /opt/panvision/.env > /dev/null
          cd /opt/panvision
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans --wait --wait-timeout 300
          sudo docker image prune -f
          EOF
          )"
